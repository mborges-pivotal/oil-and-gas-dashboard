<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oil &amp; Gas Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <!-- Add to Home Screen: manifest (Android/Chrome) + Apple tags (iOS
       Safari ignores the manifest's icons and needs a PNG touch icon). -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="O&amp;G Dash" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- Apply the last-used theme before first paint (no dark→light flash
       while the app/profile loads). utils/theme.js takes over from here. -->
  <script>
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('oilgas_theme') || 'system'; } catch (e) {}
      if (pref === 'system') {
        pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = pref === 'light' ? 'light' : 'dark';
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- Vue 3 CDN (ESM build) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <!-- App entry — must be a module for ES imports to work.
       Vue is loaded as a global (window.Vue) from the CDN script above,
       so components can reference Vue.ref, Vue.reactive, etc. directly. -->
  <script type="module" src="./app.js"></script>
</body>
</html>
